<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Grid Generator (Fixed)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #0f1115;
            color: #ffffff;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .control-panel {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            text-align: center;
        }

        .file-input-btn {
            display: inline-block;
            background-color: #4f46e5;
            color: white;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .file-input-btn:hover { background-color: #4338ca; }
        input[type="file"] { display: none; }

        .grid-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: #000000;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #232731;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); 
            gap: 6px;
        }

        .skin-item {
            width: 100%;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .skin-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .action-panel {
            margin-top: 30px;
            text-align: center;
        }

        .btn-download {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
        }

        .btn-download:hover { background-color: #059669; }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="control-panel">
        <label class="file-input-btn">
            📷 เลือกรูปภาพสกินทั้งหมด
            <input type="file" id="image-loader" accept="image/*" multiple>
        </label>
    </div>

    <div class="grid-wrapper">
        <div class="skin-grid" id="preview-grid">
            </div>
    </div>

    <div class="action-panel">
        <button class="btn-download" id="btn-download">📥 ดาวน์โหลดรูปตารางรวม</button>
    </div>

    <canvas id="canvas-export"></canvas>

    <script>
        const imageLoader = document.getElementById('image-loader');
        const previewGrid = document.getElementById('preview-grid');
        let loadedImages = [];

        imageLoader.addEventListener('change', function(e) {
            previewGrid.innerHTML = '';
            loadedImages = [];
            const files = Array.from(e.target.files);

            if (files.length === 0) return;

            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    // 1. วาดพรีวิวบนหน้าเว็บ
                    const item = document.createElement('div');
                    item.classList.add('skin-item');
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    item.appendChild(img);
                    previewGrid.appendChild(item);

                    // 2. โหลดรูปเข้า Array เพื่อเตรียมวาดลง Canvas โดยปลดล็อกเรื่อง Security
                    const canvasImg = new Image();
                    canvasImg.crossOrigin = "anonymous"; // ป้องกันปัญหาบั๊กดาวน์โหลดไม่ได้
                    canvasImg.src = event.target.result;
                    canvasImg.onload = function() {
                        loadedImages.push(canvasImg);
                    };
                };
                reader.readAsDataURL(file);
            });
        });

        document.getElementById('btn-download').addEventListener('click', function() {
            if (loadedImages.length === 0) {
                alert('กรุณาเลือกรูปภาพก่อนครับ!');
                return;
            }

            const canvas = document.getElementById('canvas-export');
            const ctx = canvas.getContext('2d');

            const canvasWidth = 1200; 
            const cols = 6; 
            const gap = 8;  
            const padding = 12; 
            
            const itemWidth = (canvasWidth - (padding * 2) - (gap * (cols - 1))) / cols;
            
            // ดึงสัดส่วนความสูงจากรูปแรกที่โหลดเสร็จมาคำนวณสัดส่วน Grid
            const sample = loadedImages[0];
            const itemHeight = itemWidth * (sample.naturalHeight / sample.naturalWidth);

            const rows = Math.ceil(loadedImages.length / cols);
            const canvasHeight = (padding * 2) + (rows * itemHeight) + ((rows - 1) * gap);

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            // เทพื้นหลังสีดำ
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // วาดรูปลงบน Canvas ใหญ่แบบรักษาสัดส่วน
            loadedImages.forEach((img, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);

                const x = padding + (col * (itemWidth + gap));
                const y = padding + (row * (itemHeight + gap));

                ctx.drawImage(img, x, y, itemWidth, itemHeight);
            });

            // ดาวน์โหลดไฟล์ภาพสำเร็จรูป
            try {
                const link = document.createElement('a');
                link.download = 'skin-grid-collection.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการเซฟภาพ กรุณาลองเปิดบนเบราว์เซอร์อื่น เช่น Google Chrome หรือ Safari ครับ");
                console.error(error);
            }
        });
    </script>
</body>
</html>
