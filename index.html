<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Gallery & Downloader</title>
    <!-- ใช้ฟอนต์ Kanit เพื่อความทันสมัย -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* รีเซ็ตค่าเริ่มต้น */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        /* ธีมมืด สไตล์เว็บ SortSkin */
        body {
            background-color: #1a1c23;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ส่วนหัวเว็บ */
        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #111317;
            border-bottom: 2px solid #2d3139;
        }

        header h1 {
            font-size: 2rem;
            color: #4f46e5; /* สีน้ำเงินม่วงแบบเท่ๆ */
            margin-bottom: 5px;
        }

        header p {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        /* โซนเรียงรูปสกิน (Grid) */
        .gallery-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            /* เรียงการ์ดสกินอัตโนมัติ ขนาดเท่าๆ กัน */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            flex: 1;
        }

        /* กล่องสกินแต่ละตัว (เหมือน SortSkin) */
        .skin-box {
            background-color: #242834;
            border-radius: 8px;
            border: 1px solid #374151;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s ease-in-out;
        }

        /* เอฟเฟกต์ตอนเอาเมาส์มาชี้ที่กล่องสกิน */
        .skin-box:hover {
            transform: translateY(-5px);
            border-color: #4f46e5;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* พื้นหลังโชว์รูปสกิน */
        .skin-display {
            width: 100%;
            height: 240px;
            background-color: #111317; /* พื้นหลังสีเข้มตัดกับรูปสกิน */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .skin-display img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* ป้องกันไม่ให้ภาพสกินเบลอ (สกิน Minecraft มักเป็น Pixel Art) */
            image-rendering: pixelated; 
        }

        /* โซนปุ่มดาวน์โหลดใต้รูป */
        .skin-actions {
            width: 100%;
            padding: 12px;
            background-color: #242834;
            text-align: center;
        }

        /* ปุ่ม Download */
        .btn-download {
            display: block;
            background-color: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn-download:hover {
            background-color: #4338ca;
        }

        /* ท้ายเว็บ */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #111317;
            color: #6b7280;
            font-size: 0.8rem;
            border-top: 1px solid #2d3139;
        }
    </style>
</head>
<body>

    <header>
        <h1>Skin Downloader</h1>
        <p>คลิกปุ่มเพื่อดาวน์โหลดไฟล์สกินไปใช้งานได้ทันที</p>
    </header>

    <!-- ส่วนที่ใช้เรียงรูปสกิน -->
    <main class="gallery-container">

        <!-- สกินตัวที่ 1 -->
        <div class="skin-box">
            <div class="skin-display">
                <!-- ใส่ชื่อไฟล์รูปสกินของคุณตรง src -->
                <img src="skin1.png" alt="Skin 1" onerror="this.src='https://placehold.co/200x240/111317/ffffff?text=No+Image'">
            </div>
            <div class="skin-actions">
                <!-- ใส่ชื่อไฟล์ตรง href และตรง download เพื่อระบุชื่อไฟล์ตอนคนกดโหลด -->
                <a href="skin1.png" download="skin1.png" class="btn-download">Download</a>
            </div>
        </div>

        <!-- สกินตัวที่ 2 -->
        <div class="skin-box">
            <div class="skin-display">
                <img src="skin2.png" alt="Skin 2" onerror="this.src='https://placehold.co/200x240/111317/ffffff?text=No+Image'">
            </div>
            <div class="skin-actions">
                <a href="skin2.png" download="skin2.png" class="btn-download">Download</a>
            </div>
        </div>

        <!-- สกินตัวที่ 3 -->
        <div class="skin-box">
            <div class="skin-display">
                <img src="skin3.png" alt="Skin 3" onerror="this.src='https://placehold.co/200x240/111317/ffffff?text=No+Image'">
            </div>
            <div class="skin-actions">
                <a href="skin3.png" download="skin3.png" class="btn-download">Download</a>
            </div>
        </div>

        <!-- สกินตัวที่ 4 -->
        <div class="skin-box">
            <div class="skin-display">
                <img src="skin4.png" alt="Skin 4" onerror="this.src='https://placehold.co/200x240/111317/ffffff?text=No+Image'">
            </div>
            <div class="skin-actions">
                <a href="skin4.png" download="skin4.png" class="btn-download">Download</a>
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 Skin Gallery. Hosted on GitHub Pages</p>
    </footer>

</body>
</html>
